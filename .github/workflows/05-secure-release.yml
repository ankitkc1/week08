name: 05 - Secure Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: koalatech-user-service

jobs:

  # =========================================================
  # Stage 1 - Functional validation
  # =========================================================
  test-user-service:
    name: 1 - Test User Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: users

        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d users"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: user-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: user-service
        run: |
          pytest -v


  # =========================================================
  # Stage 2 - Build immutable release candidate
  # =========================================================
  build-candidate:
    name: 2 - Build Immutable Release Candidate
    runs-on: ubuntu-latest

    needs:
      - test-user-service

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Set image identity
        id: image
        shell: bash
        run: |
          echo "image=${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push release candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false

      - name: Display immutable release identity
        run: |
          echo "========================================="
          echo "SECURE RELEASE CANDIDATE"
          echo "========================================="
          echo "Repository : ${{ github.repository }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Image      : ${{ steps.image.outputs.image }}"
          echo "Digest     : ${{ steps.build.outputs.digest }}"
          echo "========================================="

  # =========================================================
  # Stage 3 - Container vulnerability policy
  # =========================================================
  vulnerability-gate:
    name: 3 - Vulnerability Policy Gate
    runs-on: ubuntu-latest

    needs:
      - build-candidate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      # -----------------------------------------------------
      # Evidence scan Reports all HIGH and CRITICAL findings
      # -----------------------------------------------------
      - name: Generate full High and Critical vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-candidate.outputs.image }}@${{ needs.build-candidate.outputs.digest }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: user-service-trivy-report
          path: trivy-report.json

      # -----------------------------------------------------
      # Enforcement scan Fixable HIGH/CRITICAL findings cause pipeline failure.
      # -----------------------------------------------------
      - name: Enforce vulnerability release policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-candidate.outputs.image }}@${{ needs.build-candidate.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"